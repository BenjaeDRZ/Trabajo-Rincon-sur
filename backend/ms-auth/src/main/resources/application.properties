spring.application.name=ms-auth
server.port=8081

# MySQL Laragon (asegúrate de haber creado la BD db_auth en HeidiSQL)
spring.datasource.url=jdbc:mysql://localhost:3306/db_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Conexión con Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html